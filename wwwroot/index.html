<!DOCTYPE html>
<html>
<head>
    <title>Online Quiz</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <h1 class="text-center">Online Quiz System</h1>

        <button class="btn btn-primary" onclick="loadQuestions()">Start Quiz</button>

        <div id="quiz" class="mt-4"></div>

        <button class="btn btn-success mt-3" onclick="submitQuiz()">Submit</button>

        <h3 id="result" class="mt-3"></h3>
    </div>

    <!-- ✅ IMPORTANT: Load JS -->
    <script src="/script.js"></script>

</body>
</html>
